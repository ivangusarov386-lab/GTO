<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta id="themeColorMeta" name="theme-color" content="#0a0d12" />
  <title>Приём нормативов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0:#0a0d12; --bg-1:#10151c; --bg-2:#161d26; --line:#232c38;
      --text:#e8edf3; --muted:#8291a3;
      --accent:#ff7a1a; --accent-ink:#1a0f04; --accent-dim:rgba(255,122,26,.28);
      --good:#33d17a; --bad:#ff5470;
      --good-dim:rgba(51,209,122,.28); --bad-dim:rgba(255,84,112,.28);
      --bg-grad-a:#0b0f15; --bg-grad-b:#080b0f;
      --noise-opacity:.018; --radial-accent-opacity:.10;
      --counter-grad-a:#1b232e; --counter-grad-b:#0c1117;
      --dashed-border:#2b3542; --hover-border:#3a4655;
      --shadow-color:rgba(0,0,0,.7); --shadow-color-soft:rgba(0,0,0,.65);
      --backdrop:rgba(4,6,9,.62); --logo-shadow:rgba(0,0,0,.5);
      --font-display:'Oswald',sans-serif; --font-digits:'Bebas Neue',sans-serif; --font-body:'Inter',system-ui,sans-serif;
      color-scheme:dark;
    }
    :root[data-theme="light"] {
      --bg-0:#f3f5f8; --bg-1:#ffffff; --bg-2:#eef1f5; --line:#dbe1e8;
      --text:#1a212c; --muted:#5c6773;
      --accent:#e8690f; --accent-ink:#ffffff; --accent-dim:rgba(232,105,15,.14);
      --good:#1a9a5a; --bad:#d8264a;
      --good-dim:rgba(26,154,90,.22); --bad-dim:rgba(216,38,74,.22);
      --bg-grad-a:#eef1f6; --bg-grad-b:#e3e8ee;
      --noise-opacity:.035; --radial-accent-opacity:.07;
      --counter-grad-a:#ffffff; --counter-grad-b:#eef1f6;
      --dashed-border:#c7cedb; --hover-border:#aab4c2;
      --shadow-color:rgba(30,41,59,.12); --shadow-color-soft:rgba(30,41,59,.09);
      --backdrop:rgba(15,20,28,.4); --logo-shadow:rgba(30,41,59,.2);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;color:var(--text);font:15px/1.5 var(--font-body);
      background:
        repeating-linear-gradient(135deg, rgba(127,127,127,var(--noise-opacity)) 0 2px, transparent 2px 46px),
        radial-gradient(circle at 50% -10%, rgba(255,122,26,var(--radial-accent-opacity)), transparent 55%),
        linear-gradient(180deg,var(--bg-grad-a),var(--bg-0) 25%,var(--bg-grad-b));
      background-attachment:fixed;
      transition:background-color .3s ease,color .3s ease;
    }
    .wrap{max-width:980px;margin:0 auto;padding:36px 18px 60px}

    .site-header{text-align:center;margin-bottom:26px}
    .logo{width:104px;height:104px;border-radius:50%;margin-bottom:10px;
      filter:drop-shadow(0 8px 20px var(--logo-shadow))}
    .kicker{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.3em;font-size:11px;color:var(--accent);font-weight:600}
    h1{margin:8px 0 4px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:32px}
    .subtitle{margin:0;color:var(--muted);font-size:13.5px}
    .lane-divider{height:5px;margin:20px auto 0;max-width:200px;border-radius:3px;opacity:.6;
      background:repeating-linear-gradient(115deg, var(--accent) 0 10px, transparent 10px 20px)}

    .panel{background:var(--bg-1);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:20px;
      padding:22px;box-shadow:0 24px 60px -28px var(--shadow-color);transition:border-top-color .3s ease,background-color .3s ease,box-shadow .3s ease}

    .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .icon-btn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);
      color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
    .current-tab{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:15px;
      text-transform:uppercase;letter-spacing:.03em;color:var(--text)}
    .current-tab svg{color:var(--accent);flex:none}

    .top-fixed-left{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);
      left:calc(env(safe-area-inset-left, 0px) + 14px);z-index:45;display:flex;align-items:center;gap:10px}
    .top-fixed-right{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);
      right:calc(env(safe-area-inset-right, 0px) + 14px);z-index:45;display:flex;align-items:center;gap:10px}
    .fixed-label{height:42px;flex:none;display:flex;align-items:center;padding:0 14px;border-radius:12px;
      border:1px solid var(--line);background:var(--bg-2);color:var(--text);
      font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
      box-shadow:0 10px 26px -14px var(--shadow-color);user-select:none}
    .menu-toggle-fixed,.theme-toggle-fixed{box-shadow:0 10px 26px -14px var(--shadow-color)}
    @media (max-width:520px){
      .top-fixed-left{top:calc(env(safe-area-inset-top, 0px) + 10px);left:calc(env(safe-area-inset-left, 0px) + 10px);gap:7px}
      .top-fixed-right{top:calc(env(safe-area-inset-top, 0px) + 10px);right:calc(env(safe-area-inset-right, 0px) + 10px);gap:7px}
      .menu-toggle-fixed,.theme-toggle-fixed{width:38px;height:38px}
      .fixed-label{height:38px;padding:0 10px;font-size:11px;letter-spacing:.03em}
    }
    @media (max-width:340px){
      .fixed-label{display:none}
    }

    .drawer-backdrop{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(2px);
      opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
    .drawer-backdrop.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;left:0;height:100%;width:280px;max-width:82vw;background:var(--bg-1);
      border-right:1px solid var(--line);z-index:50;transform:translateX(-100%);
      transition:transform .28s cubic-bezier(.22,.8,.25,1),background-color .3s ease;display:flex;flex-direction:column;
      box-shadow:20px 0 60px -20px var(--shadow-color)}
    .drawer.open{transform:translateX(0)}
    .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:18px;
      border-bottom:1px solid var(--line);font-family:var(--font-display);text-transform:uppercase;
      letter-spacing:.12em;font-size:12px;color:var(--muted)}

    .tabs{display:flex;flex-direction:column;gap:5px;padding:14px;overflow-y:auto}
    .tab-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;
      border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--font-display);
      font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;
      text-align:left;transition:.15s}
    .tab-btn svg{opacity:.75;flex:none}
    .tab-btn:hover{background:var(--bg-2);color:var(--text)}
    .tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .tab-btn.active svg{opacity:1}

    .section{display:none}
    .section.active{display:block;animation:sectionIn .28s ease}
    @keyframes sectionIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}

    .counter{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border-radius:16px;border:1px solid var(--line);gap:4px;padding:14px 16px;
      background:radial-gradient(120% 140% at 50% -10%, var(--counter-grad-a) 0%, var(--counter-grad-b) 65%);
      transition:background-color .3s ease,border-color .3s ease}
    .counter::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(180deg, rgba(127,127,127,.025) 0 2px, transparent 2px 4px)}
    .counter .eyebrow{position:relative;font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    .counter .digits{position:relative;font-family:var(--font-digits);font-size:38px;line-height:1;letter-spacing:.02em;
      color:var(--accent);text-shadow:0 0 18px var(--accent-dim)}
    .value-row{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
    .value-input.pulse{transform:scale(1.06)}
    .adjust-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
      font-family:var(--font-display);font-size:20px;font-weight:800;cursor:pointer;transition:.15s}
    .adjust-btn:hover{border-color:var(--accent);color:var(--accent)}
    .value-row.small{gap:10px;justify-content:flex-start}
    .value-row.small .adjust-btn{width:38px;height:38px;font-size:16px}
    .value-input{flex:1;min-width:0;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-digits);font-size:22px;letter-spacing:.03em;transition:transform .08s ease}
    .value-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

    .tap-area{margin-top:18px;border-radius:16px;border:2px dashed var(--dashed-border);background:var(--bg-2);min-height:130px;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:0 22px;
      font-family:var(--font-display);font-size:14px;letter-spacing:.02em;text-transform:uppercase;font-weight:600;
      color:var(--muted);cursor:pointer;user-select:none;touch-action:manipulation;transition:.15s}
    .tap-area.active{border-style:solid;border-color:var(--accent);color:var(--text);background:linear-gradient(180deg, rgba(255,122,26,.08), transparent)}
    .tap-area:active{transform:scale(.99)}
    .tap-area.disabled{opacity:.45;cursor:not-allowed}

    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
    .controls button{padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
      font-family:var(--font-display);font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;
      cursor:pointer;transition:.15s}
    .controls button:hover{border-color:var(--hover-border)}
    .controls button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .controls button.primary:hover{filter:brightness(1.08)}
    .controls button.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
    .controls button.warn:hover{background:rgba(255,84,112,.1)}
    .controls button:disabled{opacity:.4;cursor:not-allowed}

    label{display:block;text-align:center;font-family:var(--font-display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    input[type="text"],input[type="number"]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--bg-2);color:var(--text);font-family:var(--font-body);font-weight:500;font-size:15px;transition:.15s}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    input.invalid,.value-input.invalid{border-color:var(--bad) !important;box-shadow:0 0 0 3px var(--bad-dim) !important}
    input.valid,.value-input.valid{border-color:var(--good) !important;box-shadow:0 0 0 3px var(--good-dim) !important}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}

    table{width:100%;border-collapse:separate;border-spacing:0;margin-top:22px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    th,td{padding:11px 14px;text-align:left;font-size:13.5px}
    th{background:var(--bg-2);font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
    td{border-top:1px solid var(--line)}
    tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
    tbody tr:hover{background:rgba(255,122,26,.05)}
    .empty-row td{text-align:center;color:var(--muted);padding:24px}

    .toast-container{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
      display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
    .toast{pointer-events:auto;padding:12px 16px;border-radius:12px;font-family:var(--font-body);
      font-size:13.5px;font-weight:500;text-align:center;background:var(--bg-1);border:1px solid var(--line);
      color:var(--text);box-shadow:0 16px 40px -14px var(--shadow-color-soft);
      opacity:0;transform:translateY(14px);transition:opacity .25s ease,transform .25s ease}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.success{border-color:var(--good);color:var(--good)}
    .toast.error{border-color:var(--bad);color:var(--bad)}

    .conn-dot{width:9px;height:9px;border-radius:50%;background:#8b96a5;flex:none;transition:.2s;margin-left:auto}
    .conn-dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
    .conn-dot.err{background:var(--bad);box-shadow:0 0 8px var(--bad)}

    .manual-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-bottom:16px}
    @media (max-width:760px){.manual-form{grid-template-columns:1fr}}

    .dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:760px){.dual-grid{grid-template-columns:1fr}}
    .dual-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg-2)}
    .dual-card h3{margin:0 0 12px;font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
    .dual-card input{margin-bottom:4px}
    .save-solo{width:100%;margin-top:12px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--accent);
      background:rgba(255,122,26,.1);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:13px;
      text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:.15s}
    .save-solo:hover{background:var(--accent);color:var(--accent-ink)}

    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>

  <script>
    // ==== Вебхук "Отжимание" — уже рабочий, оставляем как есть ====

    const PUSHUP_TOKEN = 'push123';

    // ==== Новый единый вебхук для остальных 9 нормативов ====
    // ВСТАВЬТЕ СЮДА URL после деплоя скрипта webhook_normativy.gs
    const NEW_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxMbD8_jmuw2TusVmS2a4N-enmPLJPehm7N5rsbeVqCEn-9LTCy_rOpANj0YHhU3AZ6lg/exec';
    const NEW_WEBHOOK_TOKEN = 'push123';

    // ---------- иконки дисциплин (минималистичные линейные SVG) ----------
    function icon(inner){
      return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    }
    const ICONS = {
      pushup:   icon('<line x1="12" y1="4" x2="12" y2="12"/><polyline points="8 9 12 13 16 9"/><line x1="5" y1="19" x2="19" y2="19"/>'),
      pullup:   icon('<line x1="5" y1="5" x2="19" y2="5"/><line x1="12" y1="19" x2="12" y2="9"/><polyline points="8 12 12 8 16 12"/>'),
      jump:     icon('<path d="M4 18 Q12 4 20 18"/><circle cx="12" cy="7.2" r="1.3" fill="currentColor" stroke="none"/>'),
      bend:     icon('<line x1="7" y1="4" x2="7" y2="16"/><line x1="7" y1="16" x2="20" y2="16"/>'),
      situp:    icon('<polyline points="5 16 12 8 19 16"/>'),
      shuttle:  icon('<line x1="4" y1="12" x2="20" y2="12"/><polyline points="8 7 4 12 8 17"/><polyline points="16 7 20 12 16 17"/>'),
      run:      icon('<line x1="4" y1="12" x2="18" y2="12"/><polyline points="13 7 18 12 13 17"/>'),
      throw:    icon('<line x1="5" y1="19" x2="17" y2="7"/><polyline points="9 7 17 7 17 15"/>'),
      shooting: icon('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>')
    };

    // ---------- переключение темы (тёмная/светлая) ----------
    const THEME_KEY = 'normativy_theme_v1';
    const THEME_COLOR = { dark: '#0a0d12', light: '#f3f5f8' };
    const SUN_ICON = icon('<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.3" x2="12" y2="4.7"/><line x1="12" y1="19.3" x2="12" y2="21.7"/><line x1="4.1" y1="4.1" x2="5.8" y2="5.8"/><line x1="18.2" y1="18.2" x2="19.9" y2="19.9"/><line x1="2.3" y1="12" x2="4.7" y2="12"/><line x1="19.3" y1="12" x2="21.7" y2="12"/><line x1="4.1" y1="19.9" x2="5.8" y2="18.2"/><line x1="18.2" y1="5.8" x2="19.9" y2="4.1"/>');
    const MOON_ICON = icon('<path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8Z"/>');
    const themeToggleEl = document.getElementById('themeToggle');
    const themeColorMetaEl = document.getElementById('themeColorMeta');

    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      themeToggleEl.innerHTML = theme === 'light' ? MOON_ICON : SUN_ICON;
      themeToggleEl.setAttribute('aria-label', theme === 'light' ? 'Включить тёмную тему' : 'Включить светлую тему');
      themeColorMetaEl.setAttribute('content', THEME_COLOR[theme]);
      localStorage.setItem(THEME_KEY, theme);
    }
    applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');
    themeToggleEl.addEventListener('click', ()=>{
      applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });

    // ==== Описание вкладок ====
    // kind: 'counter' (счётчик повторений: тап + −/+ + ручной ввод, без старт/стоп),
    // 'manual' (ручной ввод одного результата, тоже с −/+),
    // 'timed' (секундомер старт/стоп для двух участников сразу — бег/челнок)
    const TABS = [
      { id:'pushup',   label:'Отжимание',    icon:ICONS.pushup,   kind:'counter', webhookUrl: PUSHUP_WEBHOOK_URL, token: PUSHUP_TOKEN, sheetType: null },
      { id:'pullup',   label:'Подтягивание', icon:ICONS.pullup,   kind:'counter', webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'pullup' },
      { id:'jump',     label:'Прыжки',       icon:ICONS.jump,     kind:'counter', webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'jump' },
      { id:'situp',    label:'Пресс',        icon:ICONS.situp,    kind:'counter', webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'situp' },
      { id:'bend',     label:'Наклон',       icon:ICONS.bend,     kind:'manual',  webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'bend',     unit:'см',     step:1 },
      { id:'shuttle',  label:'Челнок 3х10',  icon:ICONS.shuttle,  kind:'timed',   webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'shuttle',  unit:'сек',    step:0.01 },
      { id:'run30',    label:'30 метров',    icon:ICONS.run,      kind:'timed',   webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'run30',    unit:'сек',    step:0.01 },
      { id:'throw',    label:'Метание',      icon:ICONS.throw,    kind:'manual',  webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'throw',    unit:'м',      step:0.1 },
      { id:'shooting', label:'Стрельба',     icon:ICONS.shooting, kind:'manual',  webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'shooting', unit:'очков', step:1 },
      { id:'run60',    label:'60м',          icon:ICONS.run,      kind:'timed',   webhookUrl: NEW_WEBHOOK_URL,     token: NEW_WEBHOOK_TOKEN, sheetType: 'run60',    unit:'сек',    step:0.01 },
    ];

    // ---------- общие утилиты ----------
    let audioCtx = null;
    function beep(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      }catch(_){}
    }
    function buzz(){ if (navigator.vibrate) navigator.vibrate(30); }
    function formatTime(ms){
      const total = Math.floor(ms/1000);
      const m = String(Math.floor(total/60)).padStart(2,'0');
      const s = String(total%60).padStart(2,'0');
      return `${m}:${s}`;
    }
    function loadArr(key){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(_){ return []; } }
    function saveArr(key, arr){ localStorage.setItem(key, JSON.stringify(arr)); }
    function tableRowsHtml(results){
      if (!results.length) return '<tr class="empty-row"><td colspan="2">Нет сохранённых результатов</td></tr>';
      return results.map(r=>`<tr><td>${r.participant}</td><td>${r.result}</td></tr>`).join('');
    }
    // toast-уведомления вместо статичной строки статуса
    const toastContainer = document.getElementById('toastContainer');
    function showToast(message, type){
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'error' ? 'error' : 'success');
      t.textContent = message;
      toastContainer.appendChild(t);
      requestAnimationFrame(()=> t.classList.add('show'));
      setTimeout(()=>{
        t.classList.remove('show');
        setTimeout(()=> t.remove(), 300);
      }, 3200);
    }
    // индикатор соединения с вебхуком (точка в тулбаре): серая — ещё не было отправок,
    // зелёная — последняя прошла успешно, красная — последняя с ошибкой
    const connDot = document.getElementById('connDot');
    function setConnStatus(ok){
      connDot.classList.remove('ok','err');
      connDot.classList.add(ok ? 'ok' : 'err');
    }

    // подсвечивает поле красным, если оно пустое, зелёным — если заполнено
    function markFieldState(el){
      const filled = (el.value||'').trim() !== '';
      el.classList.toggle('valid', filled);
      el.classList.toggle('invalid', !filled);
    }
    // навешивает живую подсветку поля (красная/зелёная), актуальную при каждом вводе
    function watchField(el){
      markFieldState(el);
      el.addEventListener('input', () => markFieldState(el));
    }

    // проверяет поля перед сохранением; возвращает true, если всё заполнено
    function validateFields(fields){
      let ok = true;
      fields.forEach(el=>{
        markFieldState(el);
        if ((el.value||'').trim() === '') ok = false;
      });
      if (!ok) showToast('Заполните номер участника и результат', 'error');
      return ok;
    }

    async function doSend(cfg, participant, result){
      if (!cfg.webhookUrl || cfg.webhookUrl.indexOf('ВСТАВЬТЕ') === 0) {
        return { ok:false, msg: 'URL вебхука не указан в коде сайта' };
      }
      try {
        const payload = { participant, result, token: cfg.token };
        if (cfg.sheetType) payload.type = cfg.sheetType;
        const body = new URLSearchParams(payload).toString();
        const response = await fetch(cfg.webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body
        });
        if (response.ok || response.type === 'opaque') {
          return { ok:true, msg: `№${participant} → ${result}` };
        }
        return { ok:false, msg: `№${participant}: ошибка (код ${response.status})` };
      } catch (e) {
        return { ok:false, msg: `№${participant}: ${e.message}` };
      }
    }

    async function sendResult(cfg, participant, result){
      const r = await doSend(cfg, participant, result);
      setConnStatus(r.ok);
      if (r.ok) {
        showToast('✅ Сохранено: ' + r.msg, 'success');
      } else {
        showToast('⚠ ' + r.msg, 'error');
      }
    }

    function exportToExcel(results, filename){
      if(results.length===0){alert('Нет данных для выгрузки');return;}
      const header=[['Номер участника','Результат']];
      const data=header.concat(results.map(r=>[r.participant,r.result]));
      const ws=XLSX.utils.aoa_to_sheet(data);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'Результаты');
      const wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      const blob=new Blob([wbout],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=filename;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }

    // ---------- рендер вкладок (кнопки переключения) ----------
    const tabsEl = document.getElementById('tabs');
    const sectionsEl = document.getElementById('sections');
    const currentTabEl = document.getElementById('currentTab');
    const drawerEl = document.getElementById('drawer');
    const drawerBackdropEl = document.getElementById('drawerBackdrop');
    const menuToggleEl = document.getElementById('menuToggle');
    const drawerCloseEl = document.getElementById('drawerClose');
    const mainPanelEl = document.getElementById('mainPanel');
    const KIND_COLORS = { counter: '#ff7a1a', timed: '#38bdf8', manual: '#33d17a' };

    function openDrawer(){ drawerEl.classList.add('open'); drawerBackdropEl.classList.add('open'); }
    function closeDrawer(){ drawerEl.classList.remove('open'); drawerBackdropEl.classList.remove('open'); }
    menuToggleEl.addEventListener('click', openDrawer);
    drawerCloseEl.addEventListener('click', closeDrawer);
    drawerBackdropEl.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

    TABS.forEach((cfg, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
      btn.innerHTML = cfg.icon + '<span>' + cfg.label + '</span>';
      btn.dataset.target = cfg.id;
      btn.addEventListener('click', ()=>switchTab(cfg.id));
      tabsEl.appendChild(btn);
    });

    function switchTab(id){
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.target===id));
      document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id === 'section-'+id));
      const cfg = TABS.find(t=>t.id===id);
      if (cfg) {
        currentTabEl.innerHTML = cfg.icon + '<span>' + cfg.label + '</span>';
        mainPanelEl.style.borderTopColor = KIND_COLORS[cfg.kind] || '#ff7a1a';
      }
      closeDrawer();
    }
    currentTabEl.innerHTML = TABS[0].icon + '<span>' + TABS[0].label + '</span>';
    mainPanelEl.style.borderTopColor = KIND_COLORS[TABS[0].kind] || '#ff7a1a';

    // ---------- построение содержимого вкладок ----------
    TABS.forEach((cfg, idx)=>{
      const section = document.createElement('div');
      section.className = 'section' + (idx===0 ? ' active' : '');
      section.id = 'section-' + cfg.id;

      if (cfg.kind === 'counter') section.innerHTML = counterTemplate(cfg);
      else if (cfg.kind === 'manual') section.innerHTML = manualTemplate(cfg);
      else if (cfg.kind === 'timed') section.innerHTML = timedTemplate(cfg);

      sectionsEl.appendChild(section);
    });

    // после того как весь HTML вставлен в DOM, навешиваем обработчики
    TABS.forEach(cfg=>{
      if (cfg.kind === 'counter') initCounter(cfg);
      else if (cfg.kind === 'manual') initManual(cfg);
      else if (cfg.kind === 'timed') initTimed(cfg);
    });

    // ---------- шаблон: счётчик повторений (отжимание/подтягивание/прыжки/пресс) ----------
    function counterTemplate(cfg){
      const id = cfg.id;
      return `
        <div class="grid">
          <div>
            <label for="${id}-participant">Номер участника</label>
            <input id="${id}-participant" type="number" inputmode="numeric" placeholder="Введите номер участника" autocomplete="off" data-nocount>
            <p class="hint">Тапайте в зоне ниже, используйте −/+ или введите число вручную.</p>
          </div>
          <div>
            <label for="${id}-digits">Повторения</label>
            <div class="value-row small" data-nocount>
              <button id="${id}-minus" class="adjust-btn" title="Минус одно повторение">−</button>
              <input id="${id}-digits" class="value-input" type="number" inputmode="numeric" placeholder="0">
              <button id="${id}-plus" class="adjust-btn" title="Плюс одно повторение">+</button>
            </div>
          </div>
        </div>
        <div id="${id}-tap" class="tap-area active" data-nocount>Тапайте здесь на каждое повторение (или жмите Пробел)</div>
        <div class="controls" data-nocount>
          <button id="${id}-reset" class="warn">Сброс</button>
          <button id="${id}-save" class="primary">Сохранить</button>
        </div>
        <table data-nocount>
          <thead><tr><th>Номер участника</th><th>Результат</th></tr></thead>
          <tbody id="${id}-tbody"></tbody>
        </table>
        <div class="controls" data-nocount>
          <button id="${id}-export" class="primary">Выгрузить в Excel</button>
          <button id="${id}-clear" class="warn">Очистить таблицу</button>
        </div>
      `;
    }

    function initCounter(cfg){
      const id = cfg.id;
      const el = s => document.getElementById(id + '-' + s);
      const digits = el('digits'), participantInput = el('participant');
      const saveBtn = el('save'), resetBtn = el('reset');
      const exportBtn = el('export'), clearBtn = el('clear'), tableBody = el('tbody');
      const tapArea = el('tap'), plusBtn = el('plus'), minusBtn = el('minus');

      const STORAGE_KEY = 'normativy_' + id + '_v1';
      let results = loadArr(STORAGE_KEY);

      watchField(digits); watchField(participantInput);

      function getCount(){ return parseInt(digits.value, 10) || 0; }
      function setCount(v){
        digits.value = String(Math.max(0, v));
        digits.classList.add('pulse');
        setTimeout(()=>digits.classList.remove('pulse'), 90);
        markFieldState(digits);
      }
      function renderTable(){
        tableBody.innerHTML = tableRowsHtml(results);
      }
      function inc(){ setCount(getCount()+1); beep(); buzz(); }
      function dec(){ setCount(getCount()-1); }
      function doReset(){
        digits.value=''; participantInput.value='';
        markFieldState(digits); markFieldState(participantInput);
      }

      tapArea.addEventListener('click', inc);
      plusBtn.addEventListener('click', inc);
      minusBtn.addEventListener('click', dec);
      document.addEventListener('keydown', (e)=>{
        if (e.code === 'Space' && document.getElementById('section-'+id).classList.contains('active') && !e.target.closest('input, textarea')) {
          e.preventDefault(); inc();
        }
      });
      resetBtn.addEventListener('click', doReset);

      saveBtn.addEventListener('click', async ()=>{
        if (!validateFields([participantInput, digits])) return;
        const participant=(participantInput.value||'').trim();
        const result = getCount();
        results.push({participant, result});
        saveArr(STORAGE_KEY, results);
        renderTable();
        await sendResult(cfg, participant, result);
        doReset();
        participantInput.focus();
      });

      exportBtn.addEventListener('click', ()=>exportToExcel(results, cfg.label + '_результаты.xlsx'));
      clearBtn.addEventListener('click', ()=>{
        if(!confirm('Очистить все результаты?')) return;
        results=[]; saveArr(STORAGE_KEY, results); renderTable();
      });

      renderTable();
    }

    // ---------- шаблон: ручной ввод одного результата (наклон/метание/стрельба) ----------
    function manualTemplate(cfg){
      const id = cfg.id;
      return `
        <div class="manual-form">
          <div>
            <label for="${id}-participant">Номер участника</label>
            <input id="${id}-participant" type="number" inputmode="numeric" placeholder="Номер участника">
          </div>
          <div>
            <label for="${id}-result">Результат${cfg.unit ? ' (' + cfg.unit + ')' : ''}</label>
            <div class="value-row small">
              <button id="${id}-minus" class="adjust-btn" type="button">−</button>
              <input id="${id}-result" class="value-input" type="number" step="${cfg.step || 1}" placeholder="0">
              <button id="${id}-plus" class="adjust-btn" type="button">+</button>
            </div>
          </div>
        </div>
        <div class="controls" data-nocount>
          <button id="${id}-reset" class="warn">Сброс</button>
          <button id="${id}-save" class="primary">Сохранить</button>
        </div>
        <table>
          <thead><tr><th>Номер участника</th><th>Результат</th></tr></thead>
          <tbody id="${id}-tbody"></tbody>
        </table>
        <div class="controls">
          <button id="${id}-export" class="primary">Выгрузить в Excel</button>
          <button id="${id}-clear" class="warn">Очистить таблицу</button>
        </div>
      `;
    }

    function initManual(cfg){
      const id = cfg.id;
      const el = s => document.getElementById(id + '-' + s);
      const participantInput = el('participant'), resultInput = el('result');
      const plusBtn = el('plus'), minusBtn = el('minus');
      const saveBtn = el('save'), resetBtn = el('reset'), tableBody = el('tbody');
      const exportBtn = el('export'), clearBtn = el('clear');

      const STORAGE_KEY = 'normativy_' + id + '_v1';
      const step = cfg.step || 1;
      let results = loadArr(STORAGE_KEY);

      watchField(participantInput); watchField(resultInput);

      function renderTable(){
        tableBody.innerHTML = tableRowsHtml(results);
      }
      function nudge(delta){
        const cur = parseFloat(resultInput.value) || 0;
        const next = Math.round((cur + delta) * 100) / 100;
        resultInput.value = next;
        markFieldState(resultInput);
      }
      function doReset(){
        participantInput.value=''; resultInput.value='';
        markFieldState(participantInput); markFieldState(resultInput);
      }
      plusBtn.addEventListener('click', ()=>nudge(step));
      minusBtn.addEventListener('click', ()=>nudge(-step));
      resetBtn.addEventListener('click', doReset);

      saveBtn.addEventListener('click', async ()=>{
        if (!validateFields([participantInput, resultInput])) return;
        const participant = (participantInput.value||'').trim();
        const result = (resultInput.value||'').trim();
        results.push({participant, result});
        saveArr(STORAGE_KEY, results);
        renderTable();
        await sendResult(cfg, participant, result);
        doReset();
        participantInput.focus();
      });

      exportBtn.addEventListener('click', ()=>exportToExcel(results, cfg.label + '_результаты.xlsx'));
      clearBtn.addEventListener('click', ()=>{
        if(!confirm('Очистить все результаты?')) return;
        results=[]; saveArr(STORAGE_KEY, results); renderTable();
      });

      renderTable();
    }

    // ---------- шаблон: секундомер для двух участников сразу (челнок/30м/60м) ----------
    function timedTemplate(cfg){
      const id = cfg.id;
      const card = n => `
        <div class="dual-card">
          <h3>Участник ${n}</h3>
          <label for="${id}-participant${n}">Номер участника</label>
          <input id="${id}-participant${n}" type="number" inputmode="numeric" placeholder="Номер участника">
          <label for="${id}-digits${n}" style="margin-top:12px">Результат${cfg.unit ? ' (' + cfg.unit + ')' : ''}</label>
          <div class="value-row" data-nocount>
            <button id="${id}-minus${n}" class="adjust-btn" type="button">−</button>
            <input id="${id}-digits${n}" class="value-input" type="number" step="${cfg.step || 0.01}" placeholder="0.00">
            <button id="${id}-plus${n}" class="adjust-btn" type="button">+</button>
          </div>
          <button id="${id}-save${n}" class="save-solo" data-nocount>Сохранить участника ${n}</button>
        </div>
      `;
      return `
        <div class="counter timed-clock">
          <div class="eyebrow">Общий секундомер</div>
          <div id="${id}-masterDigits" class="digits">0.00</div>
        </div>
        <div class="controls" data-nocount>
          <button id="${id}-start" class="primary">Старт</button>
          <button id="${id}-stop" disabled>Стоп</button>
          <button id="${id}-reset" class="warn">Сброс</button>
        </div>
        <p class="hint" style="text-align:center">Первое нажатие «Стоп» фиксирует результат участника 1, второе — участника 2. Если бежал только один — сохраните его отдельно.</p>
        <div class="dual-grid">
          ${card(1)}
          ${card(2)}
        </div>
        <div class="controls" data-nocount>
          <button id="${id}-save" class="primary">Сохранить обоих</button>
        </div>
        <table>
          <thead><tr><th>Номер участника</th><th>Результат</th></tr></thead>
          <tbody id="${id}-tbody"></tbody>
        </table>
        <div class="controls">
          <button id="${id}-export" class="primary">Выгрузить в Excel</button>
          <button id="${id}-clear" class="warn">Очистить таблицу</button>
        </div>
      `;
    }

    function initTimed(cfg){
      const id = cfg.id;
      const el = s => document.getElementById(id + '-' + s);
      const masterDigits = el('masterDigits');
      const startBtn = el('start'), stopBtn = el('stop'), resetBtn = el('reset');
      const p1 = el('participant1'), p2 = el('participant2');
      const d1 = el('digits1'), d2 = el('digits2');
      const plus1 = el('plus1'), minus1 = el('minus1'), plus2 = el('plus2'), minus2 = el('minus2');
      const saveBtn = el('save'), save1 = el('save1'), save2 = el('save2');
      const tableBody = el('tbody');
      const exportBtn = el('export'), clearBtn = el('clear');

      const STORAGE_KEY = 'normativy_' + id + '_v1';
      const step = cfg.step || 0.01;
      let running = false, elapsedMs = 0, timerHandle = null, lastTick = null;
      let frozen1 = false, frozen2 = false;

      watchField(p1); watchField(p2); watchField(d1); watchField(d2);

      function getResults(){ return loadArr(STORAGE_KEY); }
      function renderTable(){ tableBody.innerHTML = tableRowsHtml(getResults()); }

      function tick(){
        const now = Date.now();
        elapsedMs += now - lastTick;
        lastTick = now;
        const secs = (elapsedMs/1000).toFixed(2);
        masterDigits.textContent = secs;
        if (!frozen1) { d1.value = secs; markFieldState(d1); }
        if (!frozen2) { d2.value = secs; markFieldState(d2); }
      }

      function resetSlots(){
        running = false;
        if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
        elapsedMs = 0; frozen1 = false; frozen2 = false;
        masterDigits.textContent = '0.00';
        p1.value=''; p2.value=''; d1.value=''; d2.value='';
        [p1,p2,d1,d2].forEach(markFieldState);
        startBtn.disabled = false; stopBtn.disabled = true;
      }
      const doReset = resetSlots;

      startBtn.addEventListener('click', ()=>{
        elapsedMs = 0; frozen1 = false; frozen2 = false;
        d1.value = ''; d2.value = ''; masterDigits.textContent = '0.00';
        markFieldState(d1); markFieldState(d2);
        running = true;
        startBtn.disabled = true; stopBtn.disabled = false;
        lastTick = Date.now();
        timerHandle = setInterval(tick, 40);
      });

      stopBtn.addEventListener('click', ()=>{
        if (!running) return;
        const now = Date.now();
        elapsedMs += now - lastTick;
        lastTick = now;
        const secs = (elapsedMs/1000).toFixed(2);
        beep(); buzz();
        if (!frozen1) { d1.value = secs; frozen1 = true; markFieldState(d1); }
        else if (!frozen2) { d2.value = secs; frozen2 = true; markFieldState(d2); }
        if (frozen1 && frozen2) {
          running = false;
          clearInterval(timerHandle); timerHandle = null;
          startBtn.disabled = false; stopBtn.disabled = true;
        }
      });

      resetBtn.addEventListener('click', doReset);

      function nudge(input, delta){
        const cur = parseFloat(input.value) || 0;
        input.value = Math.max(0, Math.round((cur+delta)*100)/100).toFixed(2);
        markFieldState(input);
      }
      plus1.addEventListener('click', ()=>nudge(d1, step));
      minus1.addEventListener('click', ()=>nudge(d1, -step));
      plus2.addEventListener('click', ()=>nudge(d2, step));
      minus2.addEventListener('click', ()=>nudge(d2, -step));

      async function saveOne(participantInput, digitsInput){
        if (!validateFields([participantInput, digitsInput])) return;
        const participant = (participantInput.value||'').trim();
        const result = (digitsInput.value||'').trim();
        const results = getResults();
        results.push({participant, result});
        saveArr(STORAGE_KEY, results);
        renderTable();
        await sendResult(cfg, participant, result);
        participantInput.value=''; digitsInput.value='';
        markFieldState(participantInput); markFieldState(digitsInput);
      }
      save1.addEventListener('click', ()=>saveOne(p1, d1));
      save2.addEventListener('click', ()=>saveOne(p2, d2));

      saveBtn.addEventListener('click', async ()=>{
        if (!validateFields([p1, d1, p2, d2])) return;
        const participant1 = (p1.value||'').trim(), result1 = (d1.value||'').trim();
        const participant2 = (p2.value||'').trim(), result2 = (d2.value||'').trim();

        const results = getResults();
        results.push({participant: participant1, result: result1});
        results.push({participant: participant2, result: result2});
        saveArr(STORAGE_KEY, results);
        renderTable();

        const [r1, r2] = await Promise.all([
          doSend(cfg, participant1, result1),
          doSend(cfg, participant2, result2)
        ]);
        setConnStatus(r1.ok && r2.ok);
        if (r1.ok && r2.ok) {
          showToast(`✅ Сохранено: ${r1.msg} · ${r2.msg}`, 'success');
        } else {
          const parts = [];
          if (!r1.ok) parts.push(r1.msg);
          if (!r2.ok) parts.push(r2.msg);
          showToast('⚠ ' + parts.join(' · '), 'error');
        }

        resetSlots();
        p1.focus();
      });

      exportBtn.addEventListener('click', ()=>exportToExcel(getResults(), cfg.label + '_результаты.xlsx'));
      clearBtn.addEventListener('click', ()=>{
        if(!confirm('Очистить все результаты?')) return;
        saveArr(STORAGE_KEY, []); renderTable();
      });

      renderTable();
    }
  </script>
</body>
</html>
